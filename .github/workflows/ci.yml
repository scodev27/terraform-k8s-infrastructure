name: CI Pipeline GSX

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        run: |
          cd backend-app
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-gsx:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/backend-gsx:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/backend-gsx --all-tags

      - name: Build and push Nginx
        run: |
          cd nginx-app
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nginx-gsx:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/nginx-gsx:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/nginx-gsx --all-tags

  terraform-validate:
    name: Validate IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform fmt
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform
